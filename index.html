<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>2026 宮本祭典委員会 役割分担</title>
<style>
  :root {
    --red: #2D7A4F;
    --red-dark: #1B4D2E;
    --red-light: #7DBF99;
    --gold: #D4AC0D;
    --gold-light: #F9E79F;
    --cream: #FEF9F0;
    --navy: #1A252F;
    --navy-light: #2C3E50;
    --gray: #7F8C8D;
    --gray-light: #ECF0F1;
    --white: #FFFFFF;
    --highlight: #FFF3CD;
    --highlight-border: #FBBF24;
    --same-role: #D5F5E3;
    --same-role-border: #27AE60;
    --other-bg: #EBF5FB;
    --other-border: #2980B9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: var(--cream);
    color: var(--navy);
    min-height: 100vh;
  }

  /* 法被バナー */
  .happi-banner {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 130px;
    overflow: hidden;
  }

  .happi-img {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    opacity: 0.18;
    filter: grayscale(20%) contrast(1.1);
  }

  .header-overlay {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 6px 0;
  }

  /* ヘッダー */
  header {
    background: linear-gradient(135deg, #1B4D2E 0%, #2D7A4F 60%, #1A6B3C 100%);
    color: white;
    padding: 20px 16px 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
  }

  .header-deco {
    font-size: 10px;
    letter-spacing: 6px;
    color: var(--gold-light);
    margin-bottom: 4px;
    opacity: 0.9;
  }

  header h1 {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.3;
  }

  header p {
    font-size: 11px;
    margin-top: 4px;
    opacity: 0.8;
    letter-spacing: 1px;
  }

  /* セレクション エリア */
  .select-area {
    padding: 16px;
    background: white;
    border-bottom: 3px solid var(--gold);
  }

  .select-area h2 {
    font-size: 13px;
    color: var(--gray);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  .select-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  .select-wrap {
    flex: 1;
    position: relative;
  }

  .select-wrap label {
    display: block;
    font-size: 11px;
    color: #1B4D2E;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }

  select {
    width: 100%;
    padding: 10px 32px 10px 12px;
    border: 2px solid #7DBF99;
    border-radius: 8px;
    background: white;
    font-size: 15px;
    color: var(--navy);
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    transition: border-color 0.2s;
  }

  select:focus {
    outline: none;
    border-color: #1B4D2E;
    box-shadow: 0 0 0 3px rgba(45,122,79,0.2);
  }

  .select-arrow {
    position: absolute;
    right: 10px;
    bottom: 12px;
    color: #1B4D2E;
    pointer-events: none;
    font-size: 14px;
  }

  .btn-show {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #2D7A4F 0%, #1B4D2E 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    box-shadow: 0 4px 12px rgba(27,77,46,0.4);
    font-family: inherit;
  }

  .btn-show:active {
    transform: scale(0.98);
    box-shadow: 0 2px 6px rgba(27,77,46,0.3);
  }

  /* プレースホルダー */
  .placeholder {
    text-align: center;
    padding: 48px 20px;
    color: var(--gray);
  }

  .placeholder-icon {
    font-size: 48px;
    margin-bottom: 12px;
    display: block;
  }

  .placeholder p {
    font-size: 14px;
    line-height: 1.7;
  }

  /* 結果エリア */
  #result {
    padding: 16px;
  }

  /* 自分の役割 ヒーローカード */
  .my-role-hero {
    background: linear-gradient(135deg, #2D7A4F 0%, #1B4D2E 100%);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    color: white;
    box-shadow: 0 6px 20px rgba(27,77,46,0.35);
    position: relative;
    overflow: hidden;
  }

  .my-role-hero::before {
    content: '🏮';
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 52px;
    opacity: 0.15;
  }

  .my-role-hero .date-badge {
    display: inline-block;
    background: rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .my-role-hero .person-name {
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 4px;
  }

  .my-role-hero .role-count {
    font-size: 12px;
    opacity: 0.8;
  }

  /* スケジュール カード */
  .schedule-section {
    margin-bottom: 8px;
  }

  .time-card {
    background: white;
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .time-header {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    background: var(--navy);
    color: white;
    gap: 10px;
  }

  .time-label {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 1px;
    min-width: 56px;
  }

  .time-note {
    font-size: 11px;
    color: #BDC3C7;
    flex: 1;
    line-height: 1.4;
  }

  /* 自分の役割 ブロック */
  .my-role-block {
    padding: 12px 14px;
    background: var(--highlight);
    border-left: 4px solid var(--highlight-border);
  }

  .role-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--gray);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .role-text {
    font-size: 17px;
    font-weight: 800;
    color: var(--navy);
    line-height: 1.3;
  }

  /* 同じ役割の人 */
  .same-role-block {
    padding: 10px 14px;
    background: var(--same-role);
    border-left: 4px solid var(--same-role-border);
  }

  .same-role-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }

  .name-chip {
    background: white;
    border: 1.5px solid var(--same-role-border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
  }

  /* 他の人の役割 */
  .others-block {
    padding: 10px 14px;
    background: var(--other-bg);
    border-left: 4px solid var(--other-border);
  }

  .others-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 4px;
  }

  .other-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .other-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy-light);
    min-width: 60px;
  }

  .other-role {
    font-size: 12px;
    color: var(--gray);
    flex: 1;
  }

  /* 空きスロット */
  .no-duty {
    padding: 10px 14px;
    color: var(--gray);
    font-size: 13px;
    font-style: italic;
  }

  /* 備考 ブロック */
  .note-block {
    padding: 10px 14px;
    background: #FEF9E7;
    border-top: 1px dashed var(--gold);
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .note-icon {
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .note-text {
    font-size: 12px;
    line-height: 1.6;
    color: #7D6608;
  }

  /* まとめ表示のない日 */
  .no-schedule {
    text-align: center;
    padding: 32px 20px;
    color: var(--gray);
    background: white;
    border-radius: 12px;
    font-size: 14px;
  }

  /* 区切り線 */
  .divider {
    height: 1px;
    background: var(--gray-light);
  }

  /* フッター */
  footer {
    text-align: center;
    padding: 20px;
    color: var(--gray);
    font-size: 11px;
    border-top: 1px solid var(--gray-light);
    margin-top: 10px;
  }

  /* アニメーション */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .time-card {
    animation: fadeIn 0.25s ease both;
  }

  .time-card:nth-child(1) { animation-delay: 0.05s; }
  .time-card:nth-child(2) { animation-delay: 0.10s; }
  .time-card:nth-child(3) { animation-delay: 0.15s; }
  .time-card:nth-child(4) { animation-delay: 0.20s; }
  .time-card:nth-child(5) { animation-delay: 0.25s; }
  .time-card:nth-child(6) { animation-delay: 0.30s; }
  .time-card:nth-child(7) { animation-delay: 0.35s; }
  .time-card:nth-child(8) { animation-delay: 0.40s; }
  .time-card:nth-child(9) { animation-delay: 0.45s; }
  .time-card:nth-child(10) { animation-delay: 0.50s; }
</style>
</head>

function getRoleBase(role) {
  if (!role) return null;
  // 完全一致で比較：「大神輿」と「大神輿（黄色襷）」は別の役割として扱う
  return role.trim();
}

function showSchedule() {
  const date = document.getElementById('dateSelect').value;
  const name = document.getElementById('nameSelect').value;
  const resultDiv = document.getElementById('result');

  if (!date || !name) {
    resultDiv.innerHTML = '<div class="placeholder"><span class="placeholder-icon">⚠️</span><p>日付と名前の両方を<br>選択してください</p></div>';
    return;
  }

  const dayData = DATA.find(d => d.date === date);
  if (!dayData) {
    resultDiv.innerHTML = '<div class="no-schedule">データが見つかりません</div>';
    return;
  }

  // Count roles for this person
  const mySlots = dayData.slots.filter(slot => {
    const me = slot.roles.find(r => r.name === name);
    return me && me.role;
  });

  let html = '';

  // Hero card
  html += `<div class="my-role-hero">
    <div class="date-badge">${date}</div>
    <div class="person-name">👤 ${name} さん</div>
    <div class="role-count">担当スロット：${mySlots.length}件</div>
  </div>`;

  if (mySlots.length === 0) {
    html += `<div class="no-schedule">🎋 ${date} は担当なしです</div>`;
  }

  // Time cards
  dayData.slots.forEach(slot => {
    const me = slot.roles.find(r => r.name === name);
    const myRole = me ? me.role : null;
    const myRoleBase = getRoleBase(myRole);

    // Find same-role people (excluding myself)
    const sameRolePeople = myRole ? slot.roles.filter(r => {
      if (r.name === name || !r.role) return false;
      const base = getRoleBase(r.role);
      return base && myRoleBase && base === myRoleBase;
    }) : [];

    // Find other active people (excluding myself and same-role)
    const otherPeople = slot.roles.filter(r => {
      if (r.name === name || !r.role) return false;
      const base = getRoleBase(r.role);
      if (myRoleBase && base === myRoleBase) return false;
      return true;
    });

    // Only show times that have activity (my role OR others working OR note)
    if (!myRole && otherPeople.length === 0 && !slot.note) return;

    html += `<div class="time-card">
      <div class="time-header">
        <span class="time-label">🕐 ${slot.time}</span>
        ${slot.note ? `<span class="time-note">${slot.note}</span>` : ''}
      </div>`;

    // My role
    if (myRole) {
      html += `<div class="my-role-block">
        <div class="role-label">⭐ あなたの担当</div>
        <div class="role-text">${myRole}</div>
      </div>`;

      // Same role people
      if (sameRolePeople.length > 0) {
        html += `<div class="same-role-block">
          <div class="role-label">🤝 同じ担当の仲間</div>
          <div class="same-role-list">`;
        sameRolePeople.forEach(p => {
          html += `<span class="name-chip">${p.name}</span>`;
        });
        html += `</div></div>`;
      }
    } else if (slot.note) {
      // No role but has note
      html += `<div class="no-duty">この時間帯は担当なし</div>`;
    }

    // Other people's roles
    if (otherPeople.length > 0) {
      html += `<div class="others-block">
        <div class="role-label">📋 この時間の他の担当</div>
        <div class="others-list">`;
      otherPeople.forEach(p => {
        html += `<div class="other-row">
          <span class="other-name">${p.name}</span>
          <span class="other-role">${p.role}</span>
        </div>`;
      });
      html += `</div></div>`;
    }

    html += '</div>'; // time-card
  });

  resultDiv.innerHTML = html;
  resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Allow pressing Enter to search
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') showSchedule();
});
