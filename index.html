// 最終日の全員一斉片付け用のリスト
const allCleanUpList = ["相原","小宮山","吉野秀青海","剣持","大木正","大木佳","藤井","池田","長谷川","蟹江","友滝寺本","岩崎","舘野","津田","稲垣","西島","大石","倉田け","倉田ゆ","加藤父","加藤ひ","加藤宏太郎","加藤宏樹","吉野敏","鈴木","一木","清野"];

function showSchedule() {
    const date = document.getElementById("dateSelect").value;
    const name = document.getElementById("nameSelect").value;
    const resultArea = document.getElementById("resultArea");
    
    resultArea.innerHTML = "";
    
    // タイトル表示
    const title = document.createElement("div");
    title.className = "result-title";
    title.innerText = `${date}の日程 - ${name} さんの予定`;
    resultArea.appendChild(title);
    
    const dayData = festivalData[date];
    if (!dayData) return;

    let hasPlan = false;
    
    // 時間帯ごとにスケジュールをチェック
    const times = ["7:00", "8:00", "9:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00", "21:00"];
    
    times.forEach(time => {
        let role = "";
        
        // 6/9 21:00 の全体片付け特殊判定
        if (date === "6/9" && time === "21:00" && allCleanUpList.includes(name)) {
            role = "片付け（全員）";
        } else if (dayData.roles[name] && dayData.roles[name][time]) {
            role = dayData.roles[name][time];
        } else if (time === "11:00" && dayData.roles[name] && dayData.roles[name]["11:00"]) {
            // 6/7の11:00~19:00など、まとまったシフトの救済
            role = dayData.roles[name]["11:00"];
        }
        
        // 役割がある、またはその時間に全体備考がある場合表示
        const memo = dayData.memos[time];
        
        if (role || memo) {
            // 自分の役割がなくても、全体の動き（備考）があれば表示して流れをわかりやすくする
            if (!role) role = "（個別の役割指定なし／フリー）";
            else hasPlan = true;
            
            const item = document.createElement("div");
            item.className = "schedule-item";
            
            let memoHtml = memo ? `<div class="memo-text"><strong>【全体の動き/備考】</strong><br>${memo.replace(/\s\/\s/g, '<br>')}</div>` : '';
            
            item.innerHTML = `
                <div class="time-badge">${time}〜</div>
                <div class="role-text">担当： ${role}</div>
                ${memoHtml}
            `;
            resultArea.appendChild(item);
        }
    });
    
    if (!hasPlan && resultArea.querySelectorAll('.role-text').length === 0) {
        resultArea.innerHTML += `<div class="no-plan">この日の予定は登録されていません。</div>`;
    }
}
